# Local infrastructure for FIRINGI development.
#   docker compose up -d
services:
  postgres:
    image: postgis/postgis:16-3.4   # PostGIS needed from Phase 6 (radius / zone service areas)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firingi
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init/20-firingi-postgis.sql:/docker-entrypoint-initdb.d/20-firingi-postgis.sql:ro
  s3:               # S3-compatible file storage for trying STORAGE_DRIVER=s3 locally (SeaweedFS; MinIO no longer publishes images)
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=0
    ports: ["8333:8333"]   # S3_ENDPOINT=http://localhost:8333, keys firingi / firingi-secret, S3_FORCE_PATH_STYLE=true
    volumes:
      - s3data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
  mailpit:          # catches all outgoing e-mail in dev — http://localhost:8025
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata: {}
  s3data: {}
