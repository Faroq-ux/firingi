# FIRINGI production stack — portable: runs on any Linux host with Docker (VPS, dedicated server,
# or as a reference for a container platform). Everything is configured in .env.production
# (copy .env.production.example). See docs/operations.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile https up -d   # + automatic HTTPS (Caddy)
#
# Services: db (PostgreSQL 16 + PostGIS) → migrate (one-shot) → app (Next.js) ← scheduler (jobs),
#           backup (nightly encrypted dumps + monthly restore test), caddy (optional HTTPS).
x-app-env: &app-env
  FIRINGI_ENV: production
  DATABASE_URL: postgresql://firingi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/firingi
  CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: firingi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: firingi
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firingi -d firingi"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  migrate:
    build: { context: ., target: tools }
    image: firingi-tools:${FIRINGI_VERSION:-latest}
    env_file: [.env.production]
    environment: *app-env
    depends_on: { db: { condition: service_healthy } }
    command: ["pnpm", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build: { context: ., target: app, args: { GIT_COMMIT: "${GIT_COMMIT:-dev}" } }
    image: firingi:${FIRINGI_VERSION:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports: ["${APP_PORT:-3000}:3000"]
    volumes: [storage:/app/storage]

  scheduler:
    build: { context: ., target: ops }
    image: firingi-ops:${FIRINGI_VERSION:-latest}
    restart: unless-stopped
    environment:
      APP_INTERNAL_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
    depends_on: { app: { condition: service_healthy } }
    command: ["/opt/firingi/scheduler.sh"]

  backup:
    image: firingi-ops:${FIRINGI_VERSION:-latest}
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      <<: *app-env
      APP_INTERNAL_URL: http://app:3000
      BACKUP_DIR: /backups
    depends_on:
      db: { condition: service_healthy }
      scheduler: { condition: service_started }
    volumes: [backups:/backups]
    command: ["/opt/firingi/backup-loop.sh"]

  caddy:
    profiles: ["https"]
    image: caddy:2.8
    restart: unless-stopped
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN for HTTPS}" }
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: { app: { condition: service_healthy } }

volumes:
  pgdata: {}
  storage: {}
  backups: {}
  caddy_data: {}
  caddy_config: {}
